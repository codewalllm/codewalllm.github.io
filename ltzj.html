<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>雷霆战机H5</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(to bottom, #1a237e, #000051);
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            width: 360px;
            height: 540px;
        }
        #game-canvas {
            background-color: #000;
            border: 2px solid #4fc3f7;
            border-radius: 5px;
            box-shadow: 0 0 20px rgba(79, 195, 247, 0.5);
        }
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #fff;
            font-size: 14px;
            text-shadow: 1px 1px 2px #000;
        }
        #level-up-screen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 50, 0.8);
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            color: #fff;
            display: none;
            border: 2px solid #4fc3f7;
            box-shadow: 0 0 20px rgba(79, 195, 247, 0.8);
        }
        button {
            background: #4fc3f7;
            color: #000;
            border: none;
            padding: 10px 20px;
            margin-top: 15px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
        }
        button:hover {
            background: #29b6f6;
        }
        .stars {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        .star {
            position: absolute;
            width: 1px;
            height: 1px;
            background: #fff;
            animation: twinkle 2s infinite;
        }
        @keyframes twinkle {
            0%, 100% { opacity: 0.2; }
            50% { opacity: 1; }
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="game-canvas" width="360" height="540"></canvas>
        <div id="ui">
            <div>关卡: <span id="level">1</span></div>
            <div>分数: <span id="score">0</span></div>
            <div>生命: <span id="lives">3</span></div>
            <div>等级: <span id="player-level">1</span></div>
            <div>攻击力: <span id="damage">10</span></div>
        </div>
        <div id="level-up-screen">
            <h2>恭喜通过第<span id="current-level">1</span>关！</h2>
            <p>准备迎接下一关的挑战</p>
            <button id="next-level-btn">进入下一关</button>
        </div>
        <div class="stars" id="stars"></div>
    </div>

    <script>
        // 创建背景星星
        function createStars() {
            const stars = document.getElementById('stars');
            for (let i = 0; i < 100; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.animationDelay = Math.random() * 2 + 's';
                stars.appendChild(star);
            }
        }
        
        // 游戏主类
        class Game {
            constructor() {
                this.canvas = document.getElementById('game-canvas');
                this.ctx = this.canvas.getContext('2d');
                this.width = this.canvas.width;
                this.height = this.canvas.height;
                
                this.player = new Player(this);
                this.enemies = [];
                this.bullets = [];
                this.particles = [];
                
                this.level = 1;
                this.score = 0;
                this.gameOver = false;
                
                this.spawnInterval = null;
                this.lastSpawnTime = 0;
                
                this.init();
                this.setupEventListeners();
            }
            
            init() {
                this.player = new Player(this);
                this.enemies = [];
                this.bullets = [];
                this.particles = [];
                
                // 根据关卡设置敌人生成速率
                clearInterval(this.spawnInterval);
                const spawnRate = 1000 - (this.level * 100); // 随关卡增加生成频率
                this.spawnInterval = setInterval(() => this.spawnEnemy(), Math.max(200, spawnRate));
                
                this.updateUI();
            }
            
            spawnEnemy() {
                const x = Math.random() * (this.width - 60) + 30;
                const speed = 1 + this.level * 0.2; // 随关卡增加速度
                const health = 1 + Math.floor(this.level / 2); // 随关卡增加生命值
                
                this.enemies.push(new Enemy(this, x, -30, speed, health));
            }
            
            update() {
                if (this.gameOver) return;
                
                this.ctx.clearRect(0, 0, this.width, this.height);
                
                // 绘制背景
                this.drawBackground();
                
                // 更新和绘制粒子
                this.particles.forEach((particle, index) => {
                    particle.update();
                    particle.draw();
                    if (particle.alpha <= 0) {
                        this.particles.splice(index, 1);
                    }
                });
                
                // 更新和绘制玩家
                this.player.update();
                this.player.draw();
                
                // 更新和绘制子弹
                this.bullets.forEach((bullet, index) => {
                    bullet.update();
                    bullet.draw();
                    
                    // 移除超出屏幕的子弹
                    if (bullet.y < 0) {
                        this.bullets.splice(index, 1);
                    }
                });
                
                // 更新和绘制敌人
                this.enemies.forEach((enemy, eIndex) => {
                    enemy.update();
                    enemy.draw();
                    
                    // 检测敌人与子弹的碰撞
                    this.bullets.forEach((bullet, bIndex) => {
                        const dx = enemy.x - bullet.x;
                        const dy = enemy.y - bullet.y;
                        const distance = Math.sqrt(dx * dx + dy * dy);
                        
                        if (distance < enemy.radius + bullet.radius) {
                            // 敌人受伤
                            enemy.health -= bullet.damage;
                            
                            // 创建粒子效果
                            for (let i = 0; i < 5; i++) {
                                this.particles.push(new Particle(
                                    this.ctx,
                                    bullet.x,
                                    bullet.y,
                                    Math.random() * 2 + 1,
                                    `hsl(${Math.random() * 60}, 100%, 50%)`
                                ));
                            }
                            
                            // 移除子弹
                            this.bullets.splice(bIndex, 1);
                        }
                    });
                    
                    // 检测敌人与玩家的碰撞
                    const dx = enemy.x - this.player.x;
                    const dy = enemy.y - this.player.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    
                    if (distance < enemy.radius + this.player.radius) {
                        // 玩家受伤
                        this.player.lives--;
                        this.updateUI();
                        
                        // 创建粒子效果
                        for (let i = 0; i < 10; i++) {
                            this.particles.push(new Particle(
                                this.ctx,
                                this.player.x,
                                this.player.y,
                                Math.random() * 3 + 1,
                                `hsl(${Math.random() * 360}, 100%, 50%)`
                            ));
                        }
                        
                        // 移除敌人
                        this.enemies.splice(eIndex, 1);
                        
                        // 检查游戏结束
                        if (this.player.lives <= 0) {
                            this.gameOver = true;
                            setTimeout(() => alert('游戏结束！最终得分: ' + this.score), 500);
                        }
                    }
                    
                    // 移除死亡敌人
                    if (enemy.health <= 0) {
                        // 增加分数
                        this.score += 10 * this.level;
                        
                        // 增加经验值
                        this.player.exp += 5;
                        
                        // 创建粒子效果
                        for (let i = 0; i < 15; i++) {
                            this.particles.push(new Particle(
                                this.ctx,
                                enemy.x,
                                enemy.y,
                                Math.random() * 3 + 1,
                                `hsl(${Math.random() * 60}, 100%, 50%)`
                            ));
                        }
                        
                        // 移除敌人
                        this.enemies.splice(eIndex, 1);
                        
                        // 检查升级
                        if (this.player.exp >= this.player.expToLevel) {
                            this.player.levelUp();
                            this.updateUI();
                        }
                    }
                    
                    // 移除超出屏幕的敌人
                    if (enemy.y > this.height + 100) {
                        this.enemies.splice(eIndex, 1);
                    }
                });
                
                // 检查关卡完成条件
                if (this.score >= this.level * 100) {
                    this.completeLevel();
                }
                
                requestAnimationFrame(() => this.update());
            }
            
            drawBackground() {
                // 绘制星空背景
                this.ctx.fillStyle = '#000033';
                this.ctx.fillRect(0, 0, this.width, this.height);
                
                // 绘制一些星星
                this.ctx.fillStyle = '#ffffff';
                for (let i = 0; i < 50; i++) {
                    const x = Math.random() * this.width;
                    const y = (Math.random() * this.height + Date.now() / 20) % this.height;
                    const size = Math.random() * 2;
                    this.ctx.beginPath();
                    this.ctx.arc(x, y, size, 0, Math.PI * 2);
                    this.ctx.fill();
                }
            }
            
            completeLevel() {
                clearInterval(this.spawnInterval);
                this.gameOver = true;
                
                document.getElementById('current-level').textContent = this.level;
                document.getElementById('level-up-screen').style.display = 'block';
            }
            
            nextLevel() {
                this.level++;
                this.gameOver = false;
                document.getElementById('level-up-screen').style.display = 'none';
                this.init();
                this.update();
            }
            
            updateUI() {
                document.getElementById('level').textContent = this.level;
                document.getElementById('score').textContent = this.score;
                document.getElementById('lives').textContent = this.player.lives;
                document.getElementById('player-level').textContent = this.player.level;
                document.getElementById('damage').textContent = this.player.damage;
            }
            
            setupEventListeners() {
                // 鼠标移动控制玩家
                this.canvas.addEventListener('mousemove', (e) => {
                    const rect = this.canvas.getBoundingClientRect();
                    this.player.x = e.clientX - rect.left;
                });
                
                // 触摸控制
                this.canvas.addEventListener('touchmove', (e) => {
                    e.preventDefault();
                    const rect = this.canvas.getBoundingClientRect();
                    this.player.x = e.touches[0].clientX - rect.left;
                });
                
                // 下一关按钮
                document.getElementById('next-level-btn').addEventListener('click', () => {
                    this.nextLevel();
                });
            }
            
            start() {
                this.update();
            }
        }
        
        // 玩家类
        class Player {
            constructor(game) {
                this.game = game;
                this.x = game.width / 2;
                this.y = game.height - 50;
                this.radius = 15;
                this.speed = 5;
                this.lives = 3;
                this.level = 1;
                this.damage = 10;
                this.exp = 0;
                this.expToLevel = 20;
                this.lastShotTime = 0;
                this.shotInterval = 300; // 射击间隔(ms)
            }
            
            update() {
                // 限制玩家移动范围
                this.x = Math.max(this.radius, Math.min(this.game.width - this.radius, this.x));
                
                // 自动射击
                const currentTime = Date.now();
                if (currentTime - this.lastShotTime > this.shotInterval) {
                    this.shoot();
                    this.lastShotTime = currentTime;
                }
            }
            
            draw() {
                const ctx = this.game.ctx;
                
                // 绘制玩家飞船
                ctx.fillStyle = '#4fc3f7';
                ctx.beginPath();
                ctx.moveTo(this.x, this.y - this.radius);
                ctx.lineTo(this.x - this.radius, this.y + this.radius);
                ctx.lineTo(this.x + this.radius, this.y + this.radius);
                ctx.closePath();
                ctx.fill();
                
                // 绘制引擎光效
                ctx.fillStyle = '#ff9800';
                ctx.beginPath();
                ctx.moveTo(this.x - 8, this.y + this.radius);
                ctx.lineTo(this.x, this.y + this.radius + 10);
                ctx.lineTo(this.x + 8, this.y + this.radius);
                ctx.closePath();
                ctx.fill();
            }
            
            shoot() {
                this.game.bullets.push(new Bullet(this.game, this.x, this.y - 20, this.damage));
            }
            
            levelUp() {
                this.level++;
                this.damage += 5;
                this.shotInterval = Math.max(100, this.shotInterval - 20); // 提高射速，最小100ms
                this.exp -= this.expToLevel;
                this.expToLevel += 10;
                
                // 升级特效
                for (let i = 0; i < 20; i++) {
                    this.game.particles.push(new Particle(
                        this.game.ctx,
                        this.x,
                        this.y,
                        Math.random() * 4 + 1,
                        `hsl(${Math.random() * 360}, 100%, 50%)`
                    ));
                }
            }
        }
        
        // 子弹类
        class Bullet {
            constructor(game, x, y, damage) {
                this.game = game;
                this.x = x;
                this.y = y;
                this.radius = 3;
                this.speed = 7;
                this.damage = damage;
            }
            
            update() {
                this.y -= this.speed;
            }
            
            draw() {
                const ctx = this.game.ctx;
                ctx.fillStyle = '#ffeb3b';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();
                
                // 子弹光尾
                ctx.fillStyle = 'rgba(255, 235, 59, 0.5)';
                ctx.beginPath();
                ctx.arc(this.x, this.y + 8, this.radius * 1.5, 0, Math.PI * 2);
                ctx.fill();
            }
        }
        
        // 敌人类
        class Enemy {
            constructor(game, x, y, speed, health) {
                this.game = game;
                this.x = x;
                this.y = y;
                this.radius = 15;
                this.speed = speed;
                this.health = health;
                this.maxHealth = health;
            }
            
            update() {
                this.y += this.speed;
            }
            
            draw() {
                const ctx = this.game.ctx;
                
                // 绘制敌人飞船
                ctx.fillStyle = '#f44336';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();
                
                // 绘制敌人翼
                ctx.fillStyle = '#e53935';
                ctx.beginPath();
                ctx.moveTo(this.x - this.radius, this.y);
                ctx.lineTo(this.x - this.radius - 10, this.y - 10);
                ctx.lineTo(this.x - this.radius - 5, this.y);
                ctx.closePath();
                ctx.fill();
                
                ctx.beginPath();
                ctx.moveTo(this.x + this.radius, this.y);
                ctx.lineTo(this.x + this.radius + 10, this.y - 10);
                ctx.lineTo(this.x + this.radius + 5, this.y);
                ctx.closePath();
                ctx.fill();
                
                // 绘制血条
                const healthRatio = this.health / this.maxHealth;
                const barWidth = 30;
                const barHeight = 3;
                
                ctx.fillStyle = '#555';
                ctx.fillRect(this.x - barWidth/2, this.y - 25, barWidth, barHeight);
                
                ctx.fillStyle = healthRatio > 0.5 ? '#4caf50' : '#ff5722';
                ctx.fillRect(this.x - barWidth/2, this.y - 25, barWidth * healthRatio, barHeight);
            }
        }
        
        // 粒子效果类
        class Particle {
            constructor(ctx, x, y, speed, color) {
                this.ctx = ctx;
                this.x = x;
                this.y = y;
                this.speed = speed;
                this.color = color;
                this.radius = Math.random() * 3 + 1;
                this.alpha = 1;
                this.angle = Math.random() * Math.PI * 2;
                this.vx = Math.cos(this.angle) * this.speed;
                this.vy = Math.sin(this.angle) * this.speed;
            }
            
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.alpha -= 0.02;
            }
            
            draw() {
                this.ctx.save();
                this.ctx.globalAlpha = this.alpha;
                this.ctx.fillStyle = this.color;
                this.ctx.beginPath();
                this.ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                this.ctx.fill();
                this.ctx.restore();
            }
        }
        
        // 初始化游戏
        createStars();
        const game = new Game();
        game.start();
    </script>
</body>
</html>
